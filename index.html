<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Partition Tax — A Playbook for Right-Sizing Your Kafka Clusters</title>
<meta name="description" content="Internal research across sophisticated Kafka users suggests 40-70% of cluster spend is wasted on excess partitions. A layered playbook for getting it back.">
<meta name="author" content="Chuck Larrieu Casias">

<link rel="stylesheet" href="lib/reveal/reset.css">
<link rel="stylesheet" href="lib/reveal/reveal.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="lib/reveal/plugin/highlight/monokai.css">

<body>

<!--
  Slide CONTENT lives in content/*.md, one file per act. Edit those files,
  not this one; this is only the shell.

  content/README.md documents the authoring syntax: slide separators,
  speaker notes, and per-slide attributes.

  Each file is one horizontal act, so the horizontal separator below is set
  to a string that never occurs. Slides split on the three-dash line only.
-->
<div class="reveal">
<div class="slides">

  <section data-markdown="content/01-title.md"    data-separator="\r?\n@@@@@@\r?\n" data-separator-vertical="\r?\n---\r?\n" data-separator-notes="^Note:"></section>
  <section data-markdown="content/02-playbook.md"     data-separator="\r?\n@@@@@@\r?\n" data-separator-vertical="\r?\n---\r?\n" data-separator-notes="^Note:"></section>
  <section data-markdown="content/03-poll.md"      data-separator="\r?\n@@@@@@\r?\n" data-separator-vertical="\r?\n---\r?\n" data-separator-notes="^Note:"></section>
  <section data-markdown="content/04-tax.md" data-separator="\r?\n@@@@@@\r?\n" data-separator-vertical="\r?\n---\r?\n" data-separator-notes="^Note:"></section>
  <section data-markdown="content/05-prevent.md"  data-separator="\r?\n@@@@@@\r?\n" data-separator-vertical="\r?\n---\r?\n" data-separator-notes="^Note:"></section>
  <section data-markdown="content/06-clean.md"    data-separator="\r?\n@@@@@@\r?\n" data-separator-vertical="\r?\n---\r?\n" data-separator-notes="^Note:"></section>
  <section data-markdown="content/07-optimize.md"      data-separator="\r?\n@@@@@@\r?\n" data-separator-vertical="\r?\n---\r?\n" data-separator-notes="^Note:"></section>
  <section data-markdown="content/08-patch.md"    data-separator="\r?\n@@@@@@\r?\n" data-separator-vertical="\r?\n---\r?\n" data-separator-notes="^Note:"></section>
  <section data-markdown="content/09-close.md"    data-separator="\r?\n@@@@@@\r?\n" data-separator-vertical="\r?\n---\r?\n" data-separator-notes="^Note:"></section>

</div>
</div>

<button id="toc-btn" class="toc-btn" aria-expanded="false" aria-controls="toc-panel" title="Contents (press T)">
  <span class="toc-bars" aria-hidden="true"></span>Contents
</button>
<nav id="toc-panel" class="toc-panel" aria-label="Table of contents" hidden></nav>

<div class="deck-footer">The Partition Tax · Current 2026</div>

<script src="lib/reveal/reveal.js"></script>
<script src="lib/reveal/plugin/markdown/markdown.js"></script>
<script src="lib/reveal/plugin/notes/notes.js"></script>
<script src="lib/reveal/plugin/highlight/highlight.js"></script>
<script src="lib/reveal/plugin/zoom/zoom.js"></script>
<script>
  // The four-layer spine appears on six slides and is identical every time
  // except for which layer is lit. Write <div class="spine" data-act="3"></div>
  // in the Markdown; this fills it in.
  //   data-act="all"   every layer lit (the playbook map)
  //   data-act="1".."4"  that layer lit, earlier ones dimmed as done
  //   data-act="done"  all four done (the closing divider)
  const SPINE_LAYERS = [
    ['01', 'Prevent', 'platform team<br>at provisioning'],
    ['02', 'Clean',   'app teams<br>quarterly'],
    ['03', 'Optimize', 'app teams<br>at design time'],
    ['04', 'Patch',   'platform team<br>without app changes'],
  ];
  function buildSpines() {
    document.querySelectorAll('.spine[data-act]').forEach(el => {
      const act = el.dataset.act;
      el.innerHTML = SPINE_LAYERS.map(([n, name, who], i) => {
        const idx = i + 1;
        let state = '';
        if (act === 'all')       state = 'on';
        else if (act === 'done') state = 'done';
        else if (idx < +act)     state = 'done';
        else if (idx === +act)   state = 'on';
        return `<div class="layer ${state}">` +
               `<span class="n">${n}</span>` +
               `<span class="name">${name}</span>` +
               `<span class="who">${who}</span></div>`;
      }).join('');
    });
  }

  // Contents panel. Generated from the slides at runtime rather than
  // maintained by hand, so cutting or adding a slide keeps it correct.
  function buildToc() {
    const panel = document.getElementById('toc-panel');
    const btn = document.getElementById('toc-btn');
    const clean = t => t.replace(/\s+/g, ' ').trim();
    const titleOf = s => {
      const h = s.querySelector('h1, h2, h3');
      if (h && h.textContent.trim()) return clean(h.textContent);
      const k = s.querySelector('.kicker');
      if (k && k.textContent.trim()) return clean(k.textContent);
      // full-bleed diagram slides carry no heading on purpose — name them
      // by their diagram, which is what you'd search for anyway
      const img = s.querySelector('figure img, img');
      if (img) return (img.getAttribute('src') || '').split('/').pop().replace(/\.[a-z]+$/, '');
      const p = s.querySelector('p, blockquote, li');
      if (p && p.textContent.trim()) return clean(p.textContent).slice(0, 52);
      return '(untitled)';
    };
    const entries = [];
    panel.innerHTML = '';
    Reveal.getHorizontalSlides().forEach((col, h) => {
      const leaves = col.classList.contains('stack')
        ? [...col.querySelectorAll(':scope > section')] : [col];
      // Act dividers put the act name in the heading; other columns
      // (title, playbook, poll) name themselves in the kicker.
      const first = leaves[0];
      const kicker = first.querySelector('.kicker');
      const label = (first.getAttribute('data-state') === 'act' || !kicker)
        ? titleOf(first)
        : kicker.textContent.replace(/\s+/g, ' ').trim();
      const act = document.createElement('button');
      act.className = 'toc-act';
      act.innerHTML = `<span class="n">${String(h + 1).padStart(2, '0')}</span> ${label}`;
      act.onclick = () => go(h, 0);
      panel.appendChild(act);
      entries.push({ el: act, h, v: 0 });
      leaves.forEach((s, v) => {
        if (leaves.length === 1) return;          // act is the slide; no child row
        const row = document.createElement('button');
        row.className = 'toc-slide';
        row.textContent = titleOf(s);
        row.onclick = () => go(h, v);
        panel.appendChild(row);
        entries.push({ el: row, h, v });
      });
    });

    function go(h, v) { Reveal.slide(h, v); close(); }
    function open_()  { panel.hidden = false; btn.setAttribute('aria-expanded', 'true'); mark(); }
    function close()  { panel.hidden = true;  btn.setAttribute('aria-expanded', 'false'); }
    function toggle() { panel.hidden ? open_() : close(); }

    function mark() {
      const i = Reveal.getIndices();
      let best = null;
      for (const e of entries) {
        e.el.classList.remove('current');
        if (e.h === i.h && e.v === (i.v || 0)) best = e;
      }
      if (best) {
        best.el.classList.add('current');
        best.el.scrollIntoView({ block: 'nearest' });
      }
    }

    btn.onclick = e => { e.stopPropagation(); toggle(); };
    panel.onclick = e => e.stopPropagation();
    document.addEventListener('click', () => { if (!panel.hidden) close(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !panel.hidden) { close(); e.stopPropagation(); }
    });
    Reveal.on('slidechanged', () => { if (!panel.hidden) mark(); });
    Reveal.addKeyBinding({ keyCode: 84, key: 'T', description: 'Toggle contents' }, toggle);
  }

  Reveal.initialize({
    hash: true,
    slideNumber: 'c/t',
    controls: true,
    progress: true,
    center: true,
    transition: 'fade',
    transitionSpeed: 'fast',
    width: 1280,
    height: 760,
    margin: 0.06,
    minScale: 0.2,
    maxScale: 2.0,
    pdfSeparateFragments: false,

    // Horizontal = acts, vertical = slides within an act.
    // Reveal's stock right/left step through pending fragments before moving
    // horizontally, which would make "right" an unreliable act-skip. Bind them
    // to skip fragments so right/left always jump straight to the next act.
    // Down and Space keep their normal fragment-by-fragment behaviour.
    keyboard: {
      39: () => Reveal.right({ skipFragments: true }),  // right arrow -> next act
      37: () => Reveal.left({ skipFragments: true }),   // left arrow  -> previous act
    },

    plugins: [ RevealMarkdown, RevealNotes, RevealHighlight, RevealZoom ]
  }).then(() => { buildSpines(); buildToc(); });
</script>
</body>
</html>
