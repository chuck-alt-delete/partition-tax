<body>

<!--
  Slide CONTENT lives in content/*.md, one file per act. Edit those files,
  not this one; this is only the shell.

  content/README.md documents the authoring syntax: slide separators,
  speaker notes, and per-slide attributes.

  Each file is one horizontal act, so the horizontal separator below is set
  to a string that never occurs. Slides split on the three-dash line only.
-->
<div class="reveal">
<div class="slides">

  <section data-markdown="content/01-title.md"    data-separator="\r?\n@@@@@@\r?\n" data-separator-vertical="\r?\n---\r?\n" data-separator-notes="^Note:"></section>
  <section data-markdown="content/02-poll.md"     data-separator="\r?\n@@@@@@\r?\n" data-separator-vertical="\r?\n---\r?\n" data-separator-notes="^Note:"></section>
  <section data-markdown="content/03-tax.md"      data-separator="\r?\n@@@@@@\r?\n" data-separator-vertical="\r?\n---\r?\n" data-separator-notes="^Note:"></section>
  <section data-markdown="content/04-playbook.md" data-separator="\r?\n@@@@@@\r?\n" data-separator-vertical="\r?\n---\r?\n" data-separator-notes="^Note:"></section>
  <section data-markdown="content/05-prevent.md"  data-separator="\r?\n@@@@@@\r?\n" data-separator-vertical="\r?\n---\r?\n" data-separator-notes="^Note:"></section>
  <section data-markdown="content/06-clean.md"    data-separator="\r?\n@@@@@@\r?\n" data-separator-vertical="\r?\n---\r?\n" data-separator-notes="^Note:"></section>
  <section data-markdown="content/07-fix.md"      data-separator="\r?\n@@@@@@\r?\n" data-separator-vertical="\r?\n---\r?\n" data-separator-notes="^Note:"></section>
  <section data-markdown="content/08-patch.md"    data-separator="\r?\n@@@@@@\r?\n" data-separator-vertical="\r?\n---\r?\n" data-separator-notes="^Note:"></section>
  <section data-markdown="content/09-close.md"    data-separator="\r?\n@@@@@@\r?\n" data-separator-vertical="\r?\n---\r?\n" data-separator-notes="^Note:"></section>

</div>
</div>

<div class="deck-footer">The Partition Tax · Current 2026</div>

<script src="lib/reveal/reveal.js"></script>
<script src="lib/reveal/plugin/markdown/markdown.js"></script>
<script src="lib/reveal/plugin/notes/notes.js"></script>
<script src="lib/reveal/plugin/highlight/highlight.js"></script>
<script src="lib/reveal/plugin/zoom/zoom.js"></script>
<script>
  // The four-layer spine appears on six slides and is identical every time
  // except for which layer is lit. Write <div class="spine" data-act="3"></div>
  // in the Markdown; this fills it in.
  //   data-act="all"   every layer lit (the playbook map)
  //   data-act="1".."4"  that layer lit, earlier ones dimmed as done
  //   data-act="done"  all four done (the closing divider)
  const SPINE_LAYERS = [
    ['01', 'Prevent', 'platform team<br>at provisioning'],
    ['02', 'Clean',   'app teams<br>quarterly'],
    ['03', 'Fix',     'app teams<br>at design time'],
    ['04', 'Patch',   'platform team<br>without app changes'],
  ];
  function buildSpines() {
    document.querySelectorAll('.spine[data-act]').forEach(el => {
      const act = el.dataset.act;
      el.innerHTML = SPINE_LAYERS.map(([n, name, who], i) => {
        const idx = i + 1;
        let state = '';
        if (act === 'all')       state = 'on';
        else if (act === 'done') state = 'done';
        else if (idx < +act)     state = 'done';
        else if (idx === +act)   state = 'on';
        return `<div class="layer ${state}">` +
               `<span class="n">${n}</span>` +
               `<span class="name">${name}</span>` +
               `<span class="who">${who}</span></div>`;
      }).join('');
    });
  }

  Reveal.initialize({
    hash: true,
    slideNumber: 'c/t',
    controls: true,
    progress: true,
    center: true,
    transition: 'fade',
    transitionSpeed: 'fast',
    width: 1280,
    height: 760,
    margin: 0.06,
    minScale: 0.2,
    maxScale: 2.0,
    pdfSeparateFragments: false,

    // Horizontal = acts, vertical = slides within an act.
    // Reveal's stock right/left step through pending fragments before moving
    // horizontally, which would make "right" an unreliable act-skip. Bind them
    // to skip fragments so right/left always jump straight to the next act.
    // Down and Space keep their normal fragment-by-fragment behaviour.
    keyboard: {
      39: () => Reveal.right({ skipFragments: true }),  // right arrow -> next act
      37: () => Reveal.left({ skipFragments: true }),   // left arrow  -> previous act
    },

    plugins: [ RevealMarkdown, RevealNotes, RevealHighlight, RevealZoom ]
  }).then(buildSpines);
</script>
</body>
</html>
