<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img"
     aria-label="One input topic with 24 partitions forces seven internal repartition and changelog topics to 24 partitions each, giving 192 partitions in total for a stream processing job carrying under 100 kilobytes per second.">
  <defs>
    <marker id="sf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c6461"/>
    </marker>
  </defs>

  <text x="0" y="28" font-family="ui-monospace,Menlo,monospace" font-size="20" letter-spacing="2.5" fill="#bcfe68">CO-PARTITIONING PROPAGATES THE NUMBER</text>

  <!-- the one decision -->
  <rect x="2" y="54" width="336" height="80" rx="10" fill="rgba(188,254,104,0.12)" stroke="#bcfe68" stroke-width="2"/>
  <text x="22" y="86" font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#e8f0f1">orders</text>
  <text x="22" y="114" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#9db4b8">dev picked 24 at random</text>
  <text x="318" y="92" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="34" fill="#bcfe68">24</text>

  <line x1="348" y1="94" x2="392" y2="94" stroke="#4c6461" stroke-width="1.8" marker-end="url(#sf-arrow)"/>
  <text x="404" y="88" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#9db4b8">Kafka Streams happily creates repartition and</text>
  <text x="404" y="112" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#9db4b8">state store topics for every join</text>

  <!-- the seven internal topics it drags along -->
  <g font-family="ui-monospace,Menlo,monospace" font-size="17">
    <rect x="2" y="162" width="488" height="50" rx="8" fill="none" stroke="#4c6461" stroke-width="1.5"/>
    <text x="20" y="193" fill="#9db4b8">orders-by-customer-repartition</text><text x="470" y="194" text-anchor="end" font-size="22" fill="#e2725b">24</text>
    <rect x="510" y="162" width="488" height="50" rx="8" fill="none" stroke="#4c6461" stroke-width="1.5"/>
    <text x="528" y="193" fill="#9db4b8">payments-by-customer-repartition</text><text x="978" y="194" text-anchor="end" font-size="22" fill="#e2725b">24</text>

    <rect x="2" y="220" width="488" height="50" rx="8" fill="none" stroke="#4c6461" stroke-width="1.5"/>
    <text x="20" y="251" fill="#9db4b8">order-join-store-changelog</text><text x="470" y="252" text-anchor="end" font-size="22" fill="#e2725b">24</text>
    <rect x="510" y="220" width="488" height="50" rx="8" fill="none" stroke="#4c6461" stroke-width="1.5"/>
    <text x="528" y="251" fill="#9db4b8">payment-join-store-changelog</text><text x="978" y="252" text-anchor="end" font-size="22" fill="#e2725b">24</text>

    <rect x="2" y="278" width="488" height="50" rx="8" fill="none" stroke="#4c6461" stroke-width="1.5"/>
    <text x="20" y="309" fill="#9db4b8">customer-totals-changelog</text><text x="470" y="310" text-anchor="end" font-size="22" fill="#e2725b">24</text>
    <rect x="510" y="278" width="488" height="50" rx="8" fill="none" stroke="#4c6461" stroke-width="1.5"/>
    <text x="528" y="309" fill="#9db4b8">session-window-changelog</text><text x="978" y="310" text-anchor="end" font-size="22" fill="#e2725b">24</text>

    <rect x="2" y="336" width="488" height="50" rx="8" fill="none" stroke="#4c6461" stroke-width="1.5"/>
    <text x="20" y="367" fill="#9db4b8">enriched-orders-repartition</text><text x="470" y="368" text-anchor="end" font-size="22" fill="#e2725b">24</text>
  </g>

  <!-- the total -->
  <rect x="2" y="400" width="996" height="94" rx="12" fill="rgba(226,114,91,0.12)" stroke="#e2725b" stroke-width="2"/>
  <text x="26" y="440" font-family="ui-monospace,Menlo,monospace" font-size="30" fill="#e2725b">8 topics  x  24 partitions  =  192</text>
  <text x="26" y="474" font-family="ui-monospace,Menlo,monospace" font-size="20" fill="#9db4b8">total throughput of the job: under 100 KB/s</text>
</svg>
