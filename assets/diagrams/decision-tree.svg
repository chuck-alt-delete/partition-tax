<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img"
     aria-label="A two-level decision tree. Do you need key-based ordering? Yes leads to Parallel Consumer in KEY mode. No leads to a second question: do you need per-message acknowledgement? Yes leads to Share Consumers, KIP-932. No leads back to Parallel Consumer in UNORDERED mode.">

  <!-- level 1 -->
  <rect x="270" y="6" width="460" height="60" rx="10" fill="rgba(188,254,104,0.12)" stroke="#bcfe68" stroke-width="2"/>
  <text x="500" y="44" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#bcfe68">Do you need key-based ordering?</text>

  <line x1="500" y1="66" x2="500" y2="88" stroke="#4c6461" stroke-width="1.8"/>
  <line x1="152" y1="88" x2="660" y2="88" stroke="#4c6461" stroke-width="1.8"/>
  <line x1="152" y1="88" x2="152" y2="148" stroke="#4c6461" stroke-width="1.8"/>
  <line x1="660" y1="88" x2="660" y2="120" stroke="#4c6461" stroke-width="1.8"/>
  <text x="164" y="112" font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#9db4b8">yes</text>
  <text x="672" y="112" font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#9db4b8">no</text>

  <!-- yes -> Parallel Consumer, KEY -->
  <rect x="2" y="148" width="300" height="104" rx="10" fill="rgba(188,254,104,0.12)" stroke="#bcfe68" stroke-width="2"/>
  <text x="152" y="192" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#bcfe68">Parallel Consumer</text>
  <text x="152" y="222" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="20" fill="#bcfe68">KEY mode</text>

  <!-- level 2 -->
  <rect x="425" y="120" width="470" height="60" rx="10" fill="rgba(188,254,104,0.12)" stroke="#bcfe68" stroke-width="2"/>
  <text x="660" y="158" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#bcfe68">Do you need per-message ack?</text>

  <line x1="660" y1="180" x2="660" y2="202" stroke="#4c6461" stroke-width="1.8"/>
  <line x1="520" y1="202" x2="866" y2="202" stroke="#4c6461" stroke-width="1.8"/>
  <line x1="520" y1="202" x2="520" y2="244" stroke="#4c6461" stroke-width="1.8"/>
  <line x1="866" y1="202" x2="866" y2="244" stroke="#4c6461" stroke-width="1.8"/>
  <text x="532" y="228" font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#9db4b8">yes</text>
  <text x="878" y="228" font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#9db4b8">no</text>

  <!-- yes -> Share Consumers -->
  <rect x="390" y="244" width="260" height="104" rx="10" fill="none" stroke="#4c6461" stroke-width="1.8"/>
  <text x="520" y="288" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#e8f0f1">Share groups</text>
  <text x="520" y="318" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="20" fill="#9db4b8">KIP-932</text>

  <!-- no -> Parallel Consumer, UNORDERED -->
  <rect x="734" y="244" width="264" height="104" rx="10" fill="rgba(188,254,104,0.12)" stroke="#bcfe68" stroke-width="2"/>
  <text x="866" y="288" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#bcfe68">Parallel Consumer</text>
  <text x="866" y="318" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="20" fill="#bcfe68">UNORDERED mode</text>

  <!-- the point -->
  <line x1="2" y1="384" x2="998" y2="384" stroke="#2e4e56" stroke-width="1.5"/>
</svg>
