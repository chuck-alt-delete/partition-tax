<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img"
     aria-label="A topic with four partitions feeds a consumer group of four consumers, one partition each. A fifth consumer sits idle because there is no partition left to assign to it, so the partition count is a hard ceiling on consumer parallelism.">
  <defs>
    <marker id="cp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c6461"/>
    </marker>
  </defs>

  <text x="0" y="30" font-family="ui-monospace,Menlo,monospace" font-size="21" letter-spacing="2.5" fill="#bcfe68">ONE PARTITION = ONE CONSUMER = ONE THREAD</text>

  <!-- topic -->
  <text x="20" y="86" font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#5d777c">topic: payments</text>
  <rect x="14" y="98" width="268" height="300" rx="12" fill="none" stroke="#2e4e56" stroke-width="1.5"/>

  <rect x="34" y="118" width="228" height="56" rx="8" fill="rgba(188,254,104,0.10)" stroke="#4c6461" stroke-width="1.5"/>
  <text x="56" y="153" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#e8f0f1">partition 0</text>
  <rect x="34" y="188" width="228" height="56" rx="8" fill="rgba(188,254,104,0.10)" stroke="#4c6461" stroke-width="1.5"/>
  <text x="56" y="223" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#e8f0f1">partition 1</text>
  <rect x="34" y="258" width="228" height="56" rx="8" fill="rgba(188,254,104,0.10)" stroke="#4c6461" stroke-width="1.5"/>
  <text x="56" y="293" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#e8f0f1">partition 2</text>
  <rect x="34" y="328" width="228" height="56" rx="8" fill="rgba(188,254,104,0.10)" stroke="#4c6461" stroke-width="1.5"/>
  <text x="56" y="363" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#e8f0f1">partition 3</text>

  <!-- arrows -->
  <line x1="292" y1="146" x2="608" y2="146" stroke="#4c6461" stroke-width="1.8" marker-end="url(#cp-arrow)"/>
  <line x1="292" y1="216" x2="608" y2="216" stroke="#4c6461" stroke-width="1.8" marker-end="url(#cp-arrow)"/>
  <line x1="292" y1="286" x2="608" y2="286" stroke="#4c6461" stroke-width="1.8" marker-end="url(#cp-arrow)"/>
  <line x1="292" y1="356" x2="608" y2="356" stroke="#4c6461" stroke-width="1.8" marker-end="url(#cp-arrow)"/>

  <!-- consumer group -->
  <text x="622" y="86" font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#5d777c">group: settlement</text>
  <rect x="616" y="98" width="370" height="300" rx="12" fill="none" stroke="#2e4e56" stroke-width="1.5"/>

  <rect x="636" y="118" width="330" height="56" rx="8" fill="none" stroke="#bcfe68" stroke-width="1.8"/>
  <text x="658" y="153" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#bcfe68">consumer 0</text>
  <rect x="636" y="188" width="330" height="56" rx="8" fill="none" stroke="#bcfe68" stroke-width="1.8"/>
  <text x="658" y="223" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#bcfe68">consumer 1</text>
  <rect x="636" y="258" width="330" height="56" rx="8" fill="none" stroke="#bcfe68" stroke-width="1.8"/>
  <text x="658" y="293" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#bcfe68">consumer 2</text>
  <rect x="636" y="328" width="330" height="56" rx="8" fill="none" stroke="#bcfe68" stroke-width="1.8"/>
  <text x="658" y="363" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#bcfe68">consumer 3</text>

  <!-- the idle fifth -->
  <rect x="636" y="422" width="330" height="56" rx="8" fill="none" stroke="#e2725b" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="658" y="457" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#e2725b">consumer 4</text>
  <text x="612" y="444" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#e2725b">no partition left</text>
  <text x="612" y="470" text-anchor="end" font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#e2725b">to assign it</text>

</svg>
