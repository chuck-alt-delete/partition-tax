  <path d="M 2 210 L 2 222 L 56 222 L 56 210" fill="none" stroke="#bcfe68" stroke-width="2"/>
  <text x="2" y="248" font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#bcfe68">3 working</text>

  <path d="M 62 210 L 62 222 L 996 222 L 996 210" fill="none" stroke="#e2725b" stroke-width="2"/>
  <text x="529" y="248" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#e2725b">47 paying overhead for nothing</text>

  <line x1="2" y1="284" x2="998" y2="284" stroke="#2e4e56" stroke-width="1.5"/>
  <text x="2" y="326" font-family="ui-monospace,Menlo,monospace" font-size="19" fill="#9db4b8">The rule: under 1 MB/s, partitions should not exceed max(consumer group members).</text>
  <text x="2" y="360" font-family="ui-monospace,Menlo,monospace" font-size="21" fill="#9db4b8">For most topics, that number is 1.</text>
  <text x="2" y="394" font-family="ui-monospace,Menlo,monospace" font-size="21" fill="#5d777c">Everything above that line is waste by even the most generous reading.</text>
