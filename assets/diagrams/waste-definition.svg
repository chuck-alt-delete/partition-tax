<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img"
     aria-label="Fifty partition ticks for a topic producing 1 megabyte per second and read by a consumer group of three. Three ticks are lit and forty-seven are dim, because only three are doing any work.">
