<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 514" role="img"
     aria-label="A three-partition topic read by two apps through a Kafka proxy. The proxy reports three partitions to the fast app and twelve virtual partitions to the slow app. Keys are placed with hash mod twelve, and virtual partition v is served from physical partition v mod 3, so virtual partitions 0, 3, 6 and 9 all come from physical partition 0.">
  <defs>
    <marker id="vp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c6461"/>
    </marker>
  </defs>

  <!-- physical topic -->
  <rect x="2" y="8" width="292" height="238" rx="10" fill="none" stroke="#2e4e56" stroke-width="1.5"/>
  <text x="148" y="34" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#5d777c">Kafka — orders, 3 partitions</text>

  <g font-family="ui-monospace,Menlo,monospace" font-size="15">
    <rect x="18" y="48" width="260" height="52" rx="7" fill="none" stroke="#4c6461" stroke-width="1.4"/>
    <text x="34" y="79" fill="#5d777c">p0</text>
    <rect x="70"  y="60" width="30" height="28" rx="4" fill="#3987e5"/><text x="85"  y="79" text-anchor="middle" fill="#ffffff">A</text>
    <rect x="108" y="60" width="30" height="28" rx="4" fill="#008300"/><text x="123" y="79" text-anchor="middle" fill="#ffffff">D</text>
    <rect x="146" y="60" width="30" height="28" rx="4" fill="#3987e5"/><text x="161" y="79" text-anchor="middle" fill="#ffffff">A</text>

    <rect x="18" y="110" width="260" height="52" rx="7" fill="none" stroke="#4c6461" stroke-width="1.4"/>
    <text x="34" y="141" fill="#5d777c">p1</text>
    <rect x="70"  y="122" width="30" height="28" rx="4" fill="#c98500"/><text x="85"  y="141" text-anchor="middle" fill="#072024">B</text>
    <rect x="108" y="122" width="30" height="28" rx="4" fill="#c98500"/><text x="123" y="141" text-anchor="middle" fill="#072024">B</text>

    <rect x="18" y="172" width="260" height="52" rx="7" fill="none" stroke="#4c6461" stroke-width="1.4"/>
    <text x="34" y="203" fill="#5d777c">p2</text>
    <rect x="70"  y="184" width="30" height="28" rx="4" fill="#d55181"/><text x="85"  y="203" text-anchor="middle" fill="#ffffff">C</text>
    <rect x="108" y="184" width="30" height="28" rx="4" fill="#d55181"/><text x="123" y="203" text-anchor="middle" fill="#ffffff">C</text>
  </g>

  <!-- proxy -->
  <rect x="316" y="8" width="132" height="360" rx="10" fill="rgba(188,254,104,0.06)" stroke="#bcfe68" stroke-width="2"/>
  <text x="382" y="176" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="16" fill="#bcfe68">Kafka proxy</text>
  <line x1="298" y1="126" x2="312" y2="126" stroke="#4c6461" stroke-width="1.8" marker-end="url(#vp-arrow)"/>

  <!-- honest view -->
  <line x1="452" y1="66" x2="486" y2="66" stroke="#4c6461" stroke-width="1.8" marker-end="url(#vp-arrow)"/>
  <rect x="490" y="8" width="508" height="104" rx="10" fill="none" stroke="#4c6461" stroke-width="1.6"/>
  <text x="508" y="36" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#e8f0f1">app-a — told the truth</text>
  <text x="508" y="64" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#5d777c">metadata says 3 partitions</text>
  <g font-family="ui-monospace,Menlo,monospace" font-size="15" text-anchor="middle">
    <rect x="508" y="74" width="60" height="26" rx="4" fill="none" stroke="#4c6461" stroke-width="1.3"/><text x="538" y="92" fill="#9db4b8">p0</text>
    <rect x="576" y="74" width="60" height="26" rx="4" fill="none" stroke="#4c6461" stroke-width="1.3"/><text x="606" y="92" fill="#9db4b8">p1</text>
    <rect x="644" y="74" width="60" height="26" rx="4" fill="none" stroke="#4c6461" stroke-width="1.3"/><text x="674" y="92" fill="#9db4b8">p2</text>
  </g>

  <!-- the lie -->
  <line x1="452" y1="244" x2="486" y2="244" stroke="#f2a65a" stroke-width="1.8" marker-end="url(#vp-arrow)"/>
  <rect x="490" y="134" width="508" height="234" rx="10" fill="rgba(242,166,90,0.07)" stroke="#f2a65a" stroke-width="2"/>
  <text x="508" y="162" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#f2a65a">slow-app — told a lie</text>
  <text x="508" y="188" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#9db4b8">metadata says 12 partitions, so it runs 12 consumers</text>

  <g font-family="ui-monospace,Menlo,monospace" font-size="15" text-anchor="middle">
    <rect x="508" y="202" width="76" height="30" rx="4" fill="none" stroke="#4c6461" stroke-width="1.3"/><text x="546" y="222" fill="#9db4b8">v0</text>
    <rect x="592" y="202" width="76" height="30" rx="4" fill="none" stroke="#4c6461" stroke-width="1.3"/><text x="630" y="222" fill="#9db4b8">v3</text>
    <rect x="676" y="202" width="76" height="30" rx="4" fill="none" stroke="#4c6461" stroke-width="1.3"/><text x="714" y="222" fill="#9db4b8">v6</text>
    <rect x="760" y="202" width="76" height="30" rx="4" fill="none" stroke="#4c6461" stroke-width="1.3"/><text x="798" y="222" fill="#9db4b8">v9</text>

    <rect x="508" y="244" width="76" height="30" rx="4" fill="none" stroke="#4c6461" stroke-width="1.3"/><text x="546" y="264" fill="#9db4b8">v1</text>
    <rect x="592" y="244" width="76" height="30" rx="4" fill="none" stroke="#4c6461" stroke-width="1.3"/><text x="630" y="264" fill="#9db4b8">v4</text>
    <rect x="676" y="244" width="76" height="30" rx="4" fill="none" stroke="#4c6461" stroke-width="1.3"/><text x="714" y="264" fill="#9db4b8">v7</text>
    <rect x="760" y="244" width="76" height="30" rx="4" fill="none" stroke="#4c6461" stroke-width="1.3"/><text x="798" y="264" fill="#9db4b8">v10</text>

    <rect x="508" y="286" width="76" height="30" rx="4" fill="none" stroke="#4c6461" stroke-width="1.3"/><text x="546" y="306" fill="#9db4b8">v2</text>
    <rect x="592" y="286" width="76" height="30" rx="4" fill="none" stroke="#4c6461" stroke-width="1.3"/><text x="630" y="306" fill="#9db4b8">v5</text>
    <rect x="676" y="286" width="76" height="30" rx="4" fill="none" stroke="#4c6461" stroke-width="1.3"/><text x="714" y="306" fill="#9db4b8">v8</text>
    <rect x="760" y="286" width="76" height="30" rx="4" fill="none" stroke="#4c6461" stroke-width="1.3"/><text x="798" y="306" fill="#9db4b8">v11</text>
  </g>
  <g font-family="ui-monospace,Menlo,monospace" font-size="15">
    <text x="852" y="222" fill="#bcfe68">all from p0</text>
    <text x="852" y="264" fill="#bcfe68">all from p1</text>
    <text x="852" y="306" fill="#bcfe68">all from p2</text>
  </g>
  <text x="508" y="346" font-family="ui-monospace,Menlo,monospace" font-size="15" fill="#5d777c">12 consumers, 3 partitions, no app change</text>

  <!-- the arithmetic -->
  <line x1="2" y1="394" x2="998" y2="394" stroke="#2e4e56" stroke-width="1.5"/>
  <text x="2" y="428" font-family="ui-monospace,Menlo,monospace" font-size="18" fill="#9db4b8">producer   partition = hash(key) % 3</text>
  <text x="2" y="456" font-family="ui-monospace,Menlo,monospace" font-size="18" fill="#9db4b8">proxy      virtual   = hash(key) % 12,        fetch v  ->  physical = v % 3</text>
  <text x="2" y="490" font-family="ui-monospace,Menlo,monospace" font-size="18" fill="#bcfe68">12 = 4 x 3. V has to be a multiple of P, or a key lands in two places.</text>
</svg>
