<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img"
     aria-label="A timeline showing one partition processed by one thread. Key A takes 4 seconds, and keys B, C and D, each needing only 100 milliseconds, wait behind it, finishing after 4.3 seconds instead of 0.3.">
  <text x="0" y="30" font-family="ui-monospace,Menlo,monospace" font-size="21" letter-spacing="2.5" fill="#bcfe68">HEAD-OF-LINE BLOCKING</text>

  <text x="2" y="76" font-family="ui-monospace,Menlo,monospace" font-size="20" fill="#5d777c">one partition, one thread, records in offset order</text>

  <!-- timeline axis -->
  <line x1="60" y1="210" x2="960" y2="210" stroke="#2e4e56" stroke-width="1.5"/>
  <text x="60"  y="240" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#5d777c">0s</text>
  <text x="780" y="240" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#5d777c">4.0s</text>
  <text x="940" y="240" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#5d777c">4.3s</text>

  <!-- key A: 4s -->
  <rect x="60" y="106" width="720" height="58" rx="8" fill="rgba(226,114,91,0.22)" stroke="#e2725b" stroke-width="2"/>
  <text x="420" y="143" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="24" fill="#e2725b">key A — 4,000 ms  (one slow external call)</text>

  <!-- B C D -->
  <rect x="784" y="106" width="56" height="58" rx="8" fill="rgba(188,254,104,0.22)" stroke="#bcfe68" stroke-width="2"/>
  <text x="812" y="143" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="20" fill="#bcfe68">B</text>
  <rect x="844" y="106" width="56" height="58" rx="8" fill="rgba(188,254,104,0.22)" stroke="#bcfe68" stroke-width="2"/>
  <text x="872" y="143" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="20" fill="#bcfe68">C</text>
  <rect x="904" y="106" width="56" height="58" rx="8" fill="rgba(188,254,104,0.22)" stroke="#bcfe68" stroke-width="2"/>
  <text x="932" y="143" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="20" fill="#bcfe68">D</text>

  <text x="784" y="94" font-family="ui-monospace,Menlo,monospace" font-size="17" fill="#9db4b8">100 ms each</text>

  <!-- the wasted wait -->
  <path d="M 60 286 L 60 274 L 780 274 L 780 286" fill="none" stroke="#f2a65a" stroke-width="2"/>
  <text x="420" y="312" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="20" fill="#f2a65a">B, C and D wait here for 4 seconds</text>
  <text x="420" y="338" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="20" fill="#f2a65a">They share a partition with A. Nothing else connects them.</text>

  <line x1="2" y1="372" x2="998" y2="372" stroke="#2e4e56" stroke-width="1.5"/>
  <text x="2" y="414" font-family="ui-monospace,Menlo,monospace" font-size="21" fill="#e8f0f1">Different keys. Different entities. No business reason to be in the same queue.</text>
</svg>
