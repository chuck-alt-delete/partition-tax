<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img"
     aria-label="A bar showing that 1000 partitions at 10 megabytes per second each can carry 10 gigabytes per second, or 864 terabytes per day. A busy real cluster at 1 gigabyte per second fills only a tenth of it.">
  <text x="0" y="30" font-family="ui-monospace,Menlo,monospace" font-size="21" letter-spacing="2.5" fill="#bcfe68">WHAT 1,000 PARTITIONS BUYS YOU</text>

  <text x="2" y="86" font-family="ui-monospace,Menlo,monospace" font-size="26" fill="#e8f0f1">1,000 partitions  x  10 MB/s  =  10 GB/s  =  864 TB/day</text>

  <!-- the ceiling bar -->
  <rect x="2" y="120" width="996" height="86" rx="10" fill="rgba(188,254,104,0.08)" stroke="#bcfe68" stroke-width="2"/>
  <rect x="2" y="120" width="100" height="86" rx="10" fill="rgba(226,114,91,0.35)" stroke="#e2725b" stroke-width="2"/>
  <text x="118" y="152" font-family="ui-monospace,Menlo,monospace" font-size="20" fill="#e2725b">a genuinely busy cluster: 1 GB/s</text>
  <text x="118" y="180" font-family="ui-monospace,Menlo,monospace" font-size="20" fill="#5d777c">the other 90% is headroom nobody asked for</text>

  <text x="2" y="238" font-family="ui-monospace,Menlo,monospace" font-size="18" fill="#5d777c">capacity 1,000 partitions can carry</text>

  <line x1="2" y1="272" x2="998" y2="272" stroke="#2e4e56" stroke-width="1.5"/>

  <text x="2" y="318" font-family="ui-monospace,Menlo,monospace" font-size="23" fill="#9db4b8">Hands up if you run more than 1,000 partitions.</text>
  <text x="2" y="354" font-family="ui-monospace,Menlo,monospace" font-size="23" fill="#9db4b8">Hands up if you push more than 10 GB/s.</text>
  <text x="2" y="390" font-family="ui-monospace,Menlo,monospace" font-size="23" fill="#bcfe68">The gap between those two shows of hands is this talk.</text>
</svg>
